<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>ฝึกสอบ Forward</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+Thai:wght@500;600;700&family=Noto+Sans+Thai:wght@400;500;600&display=swap">
<style>
/* Layout: top bar + one working column; quiz = question card with a sticky question palette beside it */
:root{
  --bg:#FFF5D5;--card:#FFFDF5;--ink:#14203A;--muted:#5A6679;--line:#E6DAB0;
  --red:#C3002F;--accent:#F2A73C;--accent-text:#8A5300;--accent-ink:#14203A;--accent-soft:#FDEBCB;
  --gold:#FFD13F;--btn:#F2A73C;--btn-ink:#14203A;--ok:#1B7A4B;--ok-soft:#DFF2E7;--bad:#B93A0E;--bad-soft:#FCE7DC;
  --warn:#8A5A00;--warn-soft:#FFF1BF;
  --f-head:'IBM Plex Sans Thai','Noto Sans Thai',system-ui,sans-serif;
  --f-body:'Noto Sans Thai','IBM Plex Sans Thai',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#2E2A1E;--card:#3B3627;--ink:#E7EBF3;--muted:#9AA6BB;--line:#574E35;
  --accent:#F2A73C;--accent-text:#F2A73C;--accent-ink:#14203A;--accent-soft:#4A3A18;
  --gold:#FFD13F;--ok:#5BD08F;--ok-soft:#14301F;--bad:#FF9A6B;--bad-soft:#3A2016;
  --warn:#FFD13F;--warn-soft:#3A3000;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2E2A1E;--card:#3B3627;--ink:#E7EBF3;--muted:#9AA6BB;--line:#574E35;
  --accent:#F2A73C;--accent-text:#F2A73C;--accent-ink:#14203A;--accent-soft:#4A3A18;
  --gold:#FFD13F;--ok:#5BD08F;--ok-soft:#14301F;--bad:#FF9A6B;--bad-soft:#3A2016;
  --warn:#FFD13F;--warn-soft:#3A3000;color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.7;padding-block:0 48px}
h1,h2,h3{font-family:var(--f-head);line-height:1.35;margin:0;text-wrap:balance}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.ic{width:1.25em;height:1.25em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.25em}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* top bar */
.top{background:var(--card);border-bottom:3px solid var(--gold);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top .wrap{display:flex;align-items:center;gap:12px;min-height:56px;flex-wrap:wrap;padding-block:8px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-head);font-weight:700;font-size:18px}
.brand .mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.top .sp{flex:1}
.timer{font-family:var(--f-mono);font-weight:500;font-size:18px;display:inline-flex;align-items:center;gap:8px;padding:4px 12px;border:1px solid var(--line);border-radius:8px;font-variant-numeric:tabular-nums}
.timer.warn{background:var(--warn-soft);border-color:var(--gold);color:var(--warn)}
.stepper{display:flex;gap:6px;flex-wrap:wrap}
.step{display:inline-flex;align-items:center;gap:6px;font-size:14px;padding:2px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.step.cur{border-color:var(--accent);color:var(--accent-text);font-weight:600}
.step.done{background:var(--bg)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:8px 18px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--btn);border-color:var(--btn);color:var(--btn-ink);font-weight:600}
.btn.pri:hover{filter:brightness(1.06)}
.btn.pri.start{background:var(--red);border-color:var(--red);color:#FFFFFF}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:36px;padding:4px 12px;font-size:14px}

/* home */
.hero{padding-block:28px 8px}
.hero h1{font-size:clamp(26px,4vw,36px)}
.hero p{color:var(--muted);margin-top:6px;max-width:60ch}
.home{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start;margin-top:20px}
@media (max-width:900px){.home{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.lbl{font-size:13px;font-weight:600;letter-spacing:.04em;color:var(--muted);margin-bottom:10px;text-transform:uppercase}
.subjects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){.subjects{grid-template-columns:minmax(0,1fr)}}
.subj{text-align:left;display:flex;flex-direction:column;gap:6px;padding:14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);min-width:0}
.subj .row{display:flex;gap:10px;align-items:center}
.subj .ico{width:38px;height:38px;border-radius:10px;background:var(--bg);display:grid;place-items:center;color:var(--accent-text);flex:none}
.subj b{font-family:var(--f-head);font-size:16px;line-height:1.35}
.subj small{color:var(--muted);font-size:13px;line-height:1.5}
.subj .en{font-size:12px;color:var(--muted);line-height:1.4}
.subj[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.subj[aria-checked="true"] .ico{background:var(--accent);color:var(--accent-ink)}
.opts{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:8px 16px;min-height:40px}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);font-weight:600}
select{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:10px;min-height:40px;padding:4px 10px}
.chk{display:flex;gap:10px;align-items:flex-start}
.chk input{width:20px;height:20px;margin-top:4px;accent-color:var(--accent)}
.note{font-size:14px;color:var(--muted)}
.team{display:flex;gap:12px;padding-block:10px;border-top:1px solid var(--line)}
.team:first-of-type{border-top:0;padding-top:0}
.team .ico{width:34px;height:34px;border-radius:9px;background:var(--bg);display:grid;place-items:center;color:var(--accent-text);flex:none}
.team b{display:block;font-family:var(--f-head);font-size:15px;line-height:1.4}
.team span{font-size:13px;color:var(--muted);line-height:1.5;display:block}
.hist{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.hist td{padding:6px 0;border-top:1px solid var(--line)}
.hist tr:first-child td{border-top:0}
.hist td:last-child{text-align:right;font-weight:600}

/* prep */
.prep{max-width:640px;margin:48px auto 0}
.prep h2{font-size:22px;margin-bottom:4px}
.prow{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:flex-start}
.prow:first-of-type{border-top:0}
.prow .st{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;border:1.5px solid var(--line);color:var(--muted)}
.prow.done .st{background:var(--ok);border-color:var(--ok);color:var(--card)}
.prow.run .st{border-color:var(--accent);border-top-color:transparent;animation:spin 1s linear infinite}
.prow b{font-family:var(--f-head)}
.prow span{display:block;font-size:14px;color:var(--muted)}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.prow.run .st{animation:none;border-top-color:var(--accent)}}

/* quiz */
.qwrap{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px;margin-top:20px;align-items:start}
@media (max-width:860px){.qwrap{grid-template-columns:minmax(0,1fr)}.pal{order:-1}}
.qcard{padding:24px}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;align-items:center}
.chip{font-size:12.5px;padding:2px 10px;border-radius:999px;background:var(--bg);border:1px solid var(--line);color:var(--muted);line-height:1.6}
.chip.ai{background:var(--accent-soft);border-color:transparent;color:var(--accent-text)}
.qno{font-family:var(--f-head);font-weight:700;font-size:15px;color:var(--accent-text);margin-right:4px}
.ctx{background:var(--bg);border-left:3px solid var(--line);border-radius:6px;padding:12px 16px;margin-bottom:16px;white-space:pre-line;font-size:15.5px}
.stem{font-size:18px;font-weight:500;margin-bottom:16px;line-height:1.65}
.chart{margin:0 0 16px;max-width:540px}
.chart svg{width:100%;height:auto;display:block}
.ch-bar{fill:var(--accent)}.ch-grid{stroke:var(--line);stroke-width:1}.ch-axis{stroke:var(--muted);stroke-width:1.2}
.ch-t{fill:var(--muted);font-size:12px;font-family:var(--f-body)}.ch-v{fill:var(--ink);font-size:13px;font-weight:600;font-family:var(--f-mono)}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);margin-top:10px;min-height:48px}
.opt:hover{border-color:var(--muted)}
.opt .ltr{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:600;font-size:14px;flex:none;font-family:var(--f-head)}
.opt .otxt{padding-top:1px;min-width:0;overflow-wrap:anywhere}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .ltr{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.qfoot{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap;align-items:center}
.qfoot .sp{flex:1}
.pal{position:sticky;top:calc(72px + env(safe-area-inset-top,0px))}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.gq{position:relative;aspect-ratio:1;min-height:40px;border-radius:9px;border:1.5px solid var(--line);background:var(--card);font-weight:600;font-variant-numeric:tabular-nums}
.gq.ans{background:var(--ink);color:var(--card);border-color:var(--ink)}
.gq.cur{outline:3px solid var(--gold);outline-offset:1px}
.gq.flag::after{content:"";position:absolute;top:3px;right:3px;width:9px;height:9px;border-radius:50%;background:var(--accent);border:1.5px solid var(--card)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin:12px 0}
.confirm{border:1.5px solid var(--gold);background:var(--warn-soft);border-radius:12px;padding:14px;margin-top:12px;font-size:14.5px}
.confirm .row{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}

/* between + result */
.mid{max-width:620px;margin:48px auto 0;text-align:center}
.mid h2{font-size:24px;margin:10px 0 6px}
.mid .card{text-align:left;margin-top:20px}
.score{display:flex;gap:24px;flex-wrap:wrap;align-items:center}
.big{font-family:var(--f-head);font-weight:700;font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:24px;color:var(--muted);font-weight:500}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}
.tabs button{padding:6px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);min-height:40px}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px;font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:13px;padding:6px 8px 6px 0}
.tbl td{padding:8px 8px 8px 0;border-top:1px solid var(--line);vertical-align:middle}
.bar{height:8px;border-radius:4px;background:var(--bg);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;background:var(--ok)}
.scroll{overflow-x:auto}
.rq{margin-top:16px;padding:20px}
.rq h3{font-size:16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:600;font-family:var(--f-body)}
.tag.ok{background:var(--ok-soft);color:var(--ok)}.tag.bad{background:var(--bad-soft);color:var(--bad)}.tag.na{background:var(--warn-soft);color:var(--warn)}
.ro{display:flex;gap:10px;padding:10px 12px;border-radius:10px;border:1.5px solid var(--line);margin-top:8px}
.ro.ok{border-color:var(--ok);background:var(--ok-soft)}
.ro.bad{border-color:var(--bad);background:var(--bad-soft)}
.ro .ltr{width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
.ro p{font-size:15px;margin:0}
.ro .why{font-size:14px;color:var(--muted);margin-top:2px}
.ro.ok .why,.ro.bad .why{color:var(--ink)}
.ro .flag{font-size:12.5px;font-weight:600;display:inline-flex;gap:4px;align-items:center;margin-left:6px}
.row2{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}
.hrow{display:flex;justify-content:space-between;align-items:center;gap:12px;width:100%;text-align:left;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-top:8px;font-size:14.5px;min-height:48px}
button.hrow:hover{border-color:var(--muted)}
.hrow small{display:block;color:var(--muted);font-size:12.5px;line-height:1.4}
.hrow b{font-family:var(--f-head);font-variant-numeric:tabular-nums;white-space:nowrap}
/* tools: calculator + scratchpad (quantitative only) */
body.hastools{padding-block:0 104px}
.tl{position:fixed;z-index:30;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tb{display:inline-flex;align-items:center;gap:8px;min-height:46px;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);box-shadow:0 4px 14px rgba(20,32,58,.16);font-weight:500}
.tb[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:var(--btn-ink);font-weight:600}
.tp{position:fixed;z-index:30;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(76px + env(safe-area-inset-bottom,0px));width:min(320px,calc(100vw - 32px));max-height:calc(100vh - 110px);max-height:calc(100dvh - 110px);overflow-y:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:0 12px 32px rgba(20,32,58,.22)}
.tp:focus-visible{outline:none;border-color:var(--accent)}
.th{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px}
.th b{font-family:var(--f-head);font-size:15px;line-height:1.4}
.th .acts{display:flex;gap:6px;align-items:center}
.tx{width:36px;height:36px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--line);background:var(--card)}
.cd{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 12px;margin-bottom:10px;text-align:right;min-height:78px;display:flex;flex-direction:column;justify-content:flex-end;min-width:0}
.ce{font-family:var(--f-mono);font-size:14px;line-height:1.5;color:var(--muted);min-height:21px;overflow-x:auto;white-space:nowrap}
.cr{font-family:var(--f-mono);font-size:28px;line-height:1.3;overflow-x:auto;white-space:nowrap;font-variant-numeric:tabular-nums}
.ck{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ky{min-height:46px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-family:var(--f-mono);font-size:18px;font-weight:500;padding:0}
.ky.op{background:var(--bg)}
.ky.fn{background:var(--accent-soft);font-family:var(--f-body);font-size:15px}
.ky.eq{background:var(--btn);border-color:var(--btn);color:var(--btn-ink);font-weight:700}
.ky:hover{border-color:var(--muted)}
.ky:active{filter:brightness(.94)}
.tp .note{margin-top:8px;font-size:12.5px;line-height:1.5}
.th{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.th button{cursor:pointer}
.tp button,.tb{-webkit-tap-highlight-color:transparent}
@media (max-width:860px){body.toolopen{padding-block:0 470px}}
.pad{display:block;width:100%;min-height:240px;resize:vertical;border:1px solid var(--line);border-radius:10px;background-color:var(--card);color:var(--ink);font:16px/28px var(--f-body);padding:0 12px;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 27px,var(--line) 27px,var(--line) 28px);background-attachment:local}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<symbol id="i-calc" viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M9 12h.01M12 12h.01M15 12h.01M9 16h.01M12 16h.01M15 16h.01"/></symbol>
<symbol id="i-news" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M8 9h8M8 13h8M8 17h5"/></symbol>
<symbol id="i-lang" viewBox="0 0 24 24"><path d="M3 5h9M7.5 3v2M5 5c.5 4 3 7 6 8M10 5c-.5 4-3 7-6 8M13 20l4-10 4 10M14.5 17h5"/></symbol>
<symbol id="i-layers" viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5M3 17l9 5 9-5"/></symbol>
<symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>

<symbol id="i-left" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></symbol>
<symbol id="i-flag" viewBox="0 0 24 24"><path d="M6 21V4M6 4h11l-2 4 2 4H6"/></symbol>
<symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></symbol>
<symbol id="i-pencil" viewBox="0 0 24 24"><path d="M4 20l1-4L16 5l3 3L8 19l-4 1zM14 7l3 3"/></symbol>
<symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4h13v16H7a2 2 0 0 1-2-2V4zM5 18a2 2 0 0 1 2-2h11"/></symbol>
<symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol>
<symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6l8-3zM9 12l2 2 4-4"/></symbol>
<symbol id="i-hist" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8M3 3v5h5M12 7v5l3 2"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4l13 8-13 8V4z"/></symbol>
<symbol id="i-redo" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14-4L4 9M4 4v5h5M4 13a8 8 0 0 0 14 4l2-2M20 20v-5h-5"/></symbol>
<symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11l8-7 8 7v9H4v-9zM10 20v-6h4v6"/></symbol>
<symbol id="i-pen" viewBox="0 0 24 24"><path d="M5 19h14M7 15l9-9 3 3-9 9H7v-3z"/></symbol>
</defs>
</svg>

<header class="top"><div class="wrap" id="topbar"></div></header>
<main class="wrap" id="app" aria-live="polite"></main>
<div id="tools"></div>

<script id="core">
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[rnd(0,a.length-1)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const r2=x=>Math.round(x*100)/100;
const fmt=n=>Number(r2(n)).toLocaleString('en-US',{maximumFractionDigits:2});
const LT=['ก','ข','ค','ง'];

/* ---------- chart ---------- */
function barSvg(labels,vals,unit){
  const W=520,H=250,L=46,R=12,T=18,B=44,max=Math.max(...vals);
  const step=[10,20,25,50,100,200].find(s=>max/s<=5)||250,top=Math.ceil(max/step)*step;
  const pw=W-L-R,ph=H-T-B,bw=pw/vals.length*.56,y=v=>T+ph-v/top*ph;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="แผนภูมิแท่ง ${esc(labels.map((l,i)=>l+' '+vals[i]).join(', '))} ${esc(unit)}">`;
  for(let v=0;v<=top;v+=step){s+=`<line class="${v?'ch-grid':'ch-axis'}" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ch-t" x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`}
  vals.forEach((v,i)=>{const cx=L+pw/vals.length*(i+.5);
    s+=`<rect class="ch-bar" x="${cx-bw/2}" y="${y(v)}" width="${bw}" height="${T+ph-y(v)}" rx="3"/><text class="ch-v" x="${cx}" y="${y(v)-5}" text-anchor="middle">${v}</text><text class="ch-t" x="${cx}" y="${H-24}" text-anchor="middle">${esc(labels[i])}</text>`});
  s+=`<text class="ch-t" x="${W-R}" y="${H-5}" text-anchor="end">หน่วย: ${esc(unit)}</text></svg>`;
  return s;
}

/* ---------- question builders ---------- */
function mk(o){
  const opts=shuffle([{...o.right,ok:1},...o.wrong]);
  return {id:o.id,subj:'quant',grp:o.id,skill:o.skill,level:o.level,src:'variant',ctx:'',stem:o.stem,chart:o.chart||'',
    choices:opts.map(x=>String(x.v)),ans:opts.findIndex(x=>x.ok),why:opts.map(x=>x.why)};
}
function B(id,subj,grp,skill,level,ctx,stem,ok,wr){
  return {id,subj,grp:grp||id,skill,level,src:'bank',ctx:ctx||'',stem,chart:'',
    choices:[ok[0],...wr.map(x=>x[0])],ans:0,why:[ok[1],...wr.map(x=>x[1])]};
}
function reshuffle(q){
  const ix=shuffle([0,1,2,3]);
  return {...q,choices:ix.map(i=>q.choices[i]),why:ix.map(i=>q.why[i]),ans:ix.indexOf(q.ans)};
}

/* ---------- quantitative: number-varying templates ---------- */
const GENS=[
function gPrice(){const a=pick([400,500,800,1200,2000]),p=pick([10,20,25,30]),q=pick([10,15,20,25]);if(p===q)return null;
  const up=a*(1+p/100),f=up*(1-q/100);
  return mk({id:'g-price',skill:'ร้อยละและราคา',level:2,

  right:{v:fmt(f)+' บาท',why:`ถูกต้อง ราคาหลังขึ้น = ${fmt(a)} × ${fmt(1+p/100)} = ${fmt(up)} บาท แล้วลด ${q}% จากราคาใหม่ = ${fmt(up)} × ${fmt(1-q/100)} = ${fmt(f)} บาท`},
  wrong:[{v:fmt(a*(1+(p-q)/100))+' บาท',why:`ผิด เพราะนำ ${p}% กับ ${q}% มาลบกันตรงๆ แต่ ${q}% คิดจากราคาใหม่ ซึ่งเป็นฐานคนละค่ากับราคาเดิม`},
         {v:fmt(up-q)+' บาท',why:`ผิด เพราะนำ ${q} มาลบเป็นจำนวนบาท แต่โจทย์ให้ลดเป็นร้อยละ`},
         {v:fmt(a*(1-q/100))+' บาท',why:`ผิด เพราะลดจากราคาเดิมโดยไม่ได้นำการขึ้นราคา ${p}% มาคิด`}]});},
function gMargin(){const R=pick([120000,150000,200000,240000]),cr=pick([60,65,70,75,80]),C=R*cr/100,m=100-cr,mu=(R-C)/C*100,w3=(R-C)/(R+C)*100;
  return mk({id:'g-margin',skill:'กำไรและต้นทุน',level:1,

  right:{v:fmt(m)+'%',why:`ถูกต้อง กำไรขั้นต้น = ${fmt(R)} − ${fmt(C)} = ${fmt(R-C)} บาท อัตรากำไร = ${fmt(R-C)} ÷ ${fmt(R)} × 100 = ${fmt(m)}%`},
  wrong:[{v:fmt(mu)+'%',why:`ผิด เพราะหารกำไรด้วยต้นทุน (เป็นอัตรากำไรส่วนเพิ่มจากต้นทุน หรือ markup) แต่โจทย์ให้คิดจากรายได้`},
         {v:fmt(cr)+'%',why:`ผิด ค่านี้คือสัดส่วนต้นทุนต่อรายได้ ไม่ใช่อัตรากำไร`},
         {v:fmt(w3)+'%',why:`ผิด เพราะหารด้วยผลรวมของรายได้และต้นทุน ซึ่งไม่ใช่นิยามของอัตรากำไรขั้นต้น`}]});},
function gWeighted(){const n1=pick([20,30,40,50]),p1=pick([100,120,150]),n2=pick([60,70,80,100]),p2=pick([200,250,300]),tot=n1*p1+n2*p2,av=tot/(n1+n2);
  return mk({id:'g-weighted',skill:'สถิติพื้นฐาน',level:2,
  stem:`ร้านขายสินค้าสองประเภท ประเภท A ขายได้ ${n1} ชิ้น ชิ้นละ ${p1} บาท ประเภท B ขายได้ ${n2} ชิ้น ชิ้นละ ${p2} บาท ราคาขายเฉลี่ยต่อชิ้นของสินค้าทั้งหมดเป็นเท่าใด`,
  right:{v:fmt(av)+' บาท',why:`ถูกต้อง ต้องถ่วงน้ำหนักด้วยจำนวนชิ้น รายได้รวม = ${fmt(n1*p1)} + ${fmt(n2*p2)} = ${fmt(tot)} บาท หารด้วยจำนวนชิ้นรวม ${n1+n2} ได้ ${fmt(av)} บาท`},
  wrong:[{v:fmt((p1+p2)/2)+' บาท',why:`ผิด เพราะเฉลี่ยราคา ${p1} กับ ${p2} ตรงๆ โดยไม่คำนึงว่าขายแต่ละประเภทได้จำนวนไม่เท่ากัน`},
         {v:fmt(tot/2)+' บาท',why:`ผิด เพราะหารรายได้รวมด้วย 2 (จำนวนประเภท) แทนที่จะหารด้วยจำนวนชิ้น`},
         {v:fmt(tot)+' บาท',why:`ผิด ค่านี้คือรายได้รวม ไม่ใช่ราคาเฉลี่ยต่อชิ้น`}]});},
function gCompound(){const P=pick([10000,20000,50000]),r=pick([4,5,6,8]),A=P*Math.pow(1+r/100,2);
  return mk({id:'g-compound',skill:'การเงินเบื้องต้น',level:2,

  right:{v:fmt(A)+' บาท',why:`ถูกต้อง ยอดเงินรวม = ${fmt(P)} × (1 + ${r/100})² = ${fmt(A)} บาท ดอกเบี้ยของปีที่สองคิดจากยอดที่รวมดอกเบี้ยปีแรกแล้ว`},
  wrong:[{v:fmt(P*(1+2*r/100))+' บาท',why:`ผิด เพราะคิดดอกเบี้ยแบบง่าย (ไม่ทบต้น) ทั้งที่โจทย์ระบุว่าทบต้น`},
         {v:fmt(A-P)+' บาท',why:`ผิด ค่านี้คือดอกเบี้ยที่ได้รับ แต่โจทย์ถามยอดเงินรวมซึ่งต้องรวมเงินต้นด้วย`},
         {v:fmt(P*(1+r/100))+' บาท',why:`ผิด ค่านี้คือยอดเงินรวมเมื่อครบ 1 ปี ไม่ใช่ 2 ปี`}]});},
function gBreak(){const c=pick([20,25,40,50]),u=pick([200,300,400,500,800]),F=c*u,v=pick([30,40,60,80]),p=v+c;

  wrong:[{v:fmt(Math.round(F/p))+' ชิ้น',why:`ผิด เพราะหารต้นทุนคงที่ด้วยราคาขายเต็ม โดยไม่หักต้นทุนแปรผันต่อชิ้น`},
         {v:fmt(Math.round(F/v))+' ชิ้น',why:`ผิด เพราะหารต้นทุนคงที่ด้วยต้นทุนแปรผันต่อชิ้น ซึ่งไม่ใช่ส่วนที่เหลือไว้ชดเชยต้นทุนคงที่`},
         {v:fmt(Math.round(F/(p+v)))+' ชิ้น',why:`ผิด เพราะนำราคาขายมาบวกกับต้นทุนแปรผัน ควรนำมาลบกัน`}]});},
function gMedian(){const d=shuffle([12,15,18,21,24,27,30,33,36,40,45,52,58]).slice(0,7),s=d.slice().sort((a,b)=>a-b),mean=d.reduce((a,b)=>a+b,0)/7,rg=s[6]-s[0];
  return mk({id:'g-median',skill:'สถิติพื้นฐาน',level:1,
  stem:`คะแนนสอบของนักศึกษา 7 คนเป็นดังนี้ ${d.join(', ')} มัธยฐานของข้อมูลชุดนี้คือเท่าใด`,

         {v:fmt(rg),why:`ผิด ค่านี้คือพิสัย (ค่าสูงสุด − ค่าต่ำสุด) ไม่ใช่มัธยฐาน`}]});},
function gRatio(){const [a,b,c]=pick([[2,3,5],[1,2,3],[3,4,5],[2,2,1]]),sum=a+b+c,k=pick([20000,30000,40000]),T=k*sum;
  return mk({id:'g-ratio',skill:'อัตราส่วน',level:1,
  stem:`หุ้นส่วน 3 คน คือ A, B และ C ลงทุนในสัดส่วน ${a}:${b}:${c} และมีกำไรรวม ${fmt(T)} บาท หุ้นส่วน B ได้รับส่วนแบ่งกำไรกี่บาท`,
  right:{v:fmt(k*b)+' บาท',why:`ถูกต้อง ส่วนทั้งหมด = ${a}+${b}+${c} = ${sum} ส่วน หนึ่งส่วน = ${fmt(T)} ÷ ${sum} = ${fmt(k)} บาท B ได้ ${b} ส่วน = ${fmt(k*b)} บาท`},
  wrong:[{v:fmt(T/3)+' บาท',why:`ผิด เพราะแบ่งเท่าๆ กันสามคน ทั้งที่โจทย์กำหนดสัดส่วนการลงทุนไม่เท่ากัน`},
         {v:fmt(k*a)+' บาท',why:`ผิด ค่านี้คือส่วนแบ่งของ A (${a} ส่วน) ไม่ใช่ของ B`},
         {v:fmt(T*b/(a+c))+' บาท',why:`ผิด เพราะใช้ผลรวมของ A กับ C เป็นตัวหาร ต้องใช้ผลรวมของทุกส่วนคือ ${sum}`}]});},
function gDiscount(){const P=pick([1000,2000,3000,5000]),d=pick([10,20,30]),n=P*(1-d/100),pay=n*1.07;
  return mk({id:'g-discount',skill:'ร้อยละและราคา',level:2,
  stem:`สินค้าราคา ${fmt(P)} บาท ลดราคา ${d}% แล้วต้องเสียภาษีมูลค่าเพิ่ม 7% จากราคาหลังลด ผู้ซื้อต้องจ่ายเงินทั้งหมดเท่าใด`,
  right:{v:fmt(pay)+' บาท',why:`ถูกต้อง ราคาหลังลด = ${fmt(P)} × ${fmt(1-d/100)} = ${fmt(n)} บาท บวก VAT 7% = ${fmt(n)} × 1.07 = ${fmt(pay)} บาท`},

function gChartGrowth(){const v=[rnd(8,16)*5,rnd(8,16)*5,rnd(8,16)*5,rnd(8,16)*5],g=[null,0,1,2].map(i=>i===null?null:(v[i+1]-v[i])/v[i]*100);

    return i===best?`ถูกต้อง ${t} ซึ่งสูงที่สุดในสามไตรมาสที่เปรียบเทียบได้ (คิดเป็นร้อยละของยอดไตรมาสก่อนหน้า)`:`ผิด ${t} ซึ่งต่ำกว่าไตรมาส ${best+1} ที่ได้ ${fmt(mx)}%`});
  return {id:'g-chartgrowth',subj:'quant',grp:'g-chartgrowth',skill:'อ่านกราฟและแผนภูมิ',level:3,src:'variant',ctx:'',
    stem:'จากแผนภูมิ ยอดขายของบริษัทในไตรมาสใดเพิ่มขึ้นจากไตรมาสก่อนหน้าเป็นร้อยละสูงที่สุด',
    chart:barSvg([0,1,2,3].map(L),v,'ล้านบาท'),choices:[0,1,2,3].map(L),ans:best,why};},
function gChartMean(){const v=[rnd(6,22)*5,rnd(6,22)*5,rnd(6,22)*5,rnd(6,22)*5],sum=v.reduce((a,b)=>a+b,0),m=sum/4,mid=(Math.max(...v)+Math.min(...v))/2;
  return mk({id:'g-chartmean',skill:'อ่านกราฟและแผนภูมิ',level:1,
  chart:barSvg(['ไตรมาส 1','ไตรมาส 2','ไตรมาส 3','ไตรมาส 4'],v,'ล้านบาท'),
  stem:'จากแผนภูมิ ยอดขายเฉลี่ยต่อไตรมาสของบริษัทเป็นเท่าใด',
  right:{v:fmt(m)+' ล้านบาท',why:`ถูกต้อง ยอดขายรวม = ${v.join(' + ')} = ${sum} ล้านบาท หารด้วย 4 ไตรมาส = ${fmt(m)} ล้านบาท`},
  wrong:[{v:fmt(sum)+' ล้านบาท',why:`ผิด ค่านี้คือยอดขายรวมของปี ยังไม่ได้หารด้วยจำนวนไตรมาส`},
         {v:fmt(sum/3)+' ล้านบาท',why:`ผิด เพราะหารด้วย 3 แต่แผนภูมิมี 4 ไตรมาส`},
         {v:fmt(mid)+' ล้านบาท',why:`ผิด ค่านี้คือค่ากึ่งกลางของยอดสูงสุดกับต่ำสุด ซึ่งไม่ใช่ค่าเฉลี่ยของทุกไตรมาส`}]});},
function gFx(){const u=pick([2000,4000,5000,10000]),r0=pick([33,34,35,36]),d=pick([0.5,1,1.5,2]),ch=u*d;
  return mk({id:'g-fx',skill:'การเงินเบื้องต้น',level:3,
  stem:`ผู้ส่งออกไทยขายสินค้าได้ ${fmt(u)} ดอลลาร์สหรัฐ ขณะที่อัตราแลกเปลี่ยนคือ ${fmt(r0)} บาทต่อดอลลาร์ ต่อมาเงินบาทอ่อนค่าเป็น ${fmt(r0+d)} บาทต่อดอลลาร์ รายได้เป็นเงินบาทของคำสั่งซื้อนี้เปลี่ยนแปลงอย่างไร`,
  right:{v:`เพิ่มขึ้น ${fmt(ch)} บาท`,why:`ถูกต้อง รายได้เดิม = ${fmt(u*r0)} บาท รายได้ใหม่ = ${fmt(u*(r0+d))} บาท เพิ่มขึ้น ${fmt(ch)} บาท เพราะบาทอ่อนค่าทำให้ดอลลาร์เดิมแลกเงินบาทได้มากขึ้น`},

/* ---------- editor team: structural checks ---------- */
function editorCheck(q){
  const bad=[];
  if(!q||typeof q.stem!=='string'||q.stem.trim().length<8)bad.push('stem');
  if(!Array.isArray(q.choices)||q.choices.length!==4||q.choices.some(c=>typeof c!=='string'||!c.trim()))return[...bad,'choices'];
  if(new Set(q.choices.map(c=>c.trim().toLowerCase())).size!==4)bad.push('duplicate');
  if(!Number.isInteger(q.ans)||q.ans<0||q.ans>3)bad.push('answer');
  if(!Array.isArray(q.why)||q.why.length!==4||q.why.some(w=>typeof w!=='string'||w.trim().length<6))bad.push('why');
  if(q.choices.some(c=>/ทุกข้อ|ไม่มีข้อใด|all of the above|none of the above/i.test(c)))bad.push('allnone');
  if(Number.isInteger(q.ans)&&q.ans>=0&&q.ans<4){
    const L=q.choices.map(c=>c.length),o=L.filter((_,i)=>i!==q.ans),av=o.reduce((a,b)=>a+b,0)/3;
    if(L[q.ans]>40&&L[q.ans]>av*1.8)bad.push('cue');
  }
  return bad;
}
function blueprint(qs){
  const sk={},lv={1:0,2:0,3:0};
  qs.forEach(q=>{sk[q.skill]=(sk[q.skill]||0)+1;lv[q.level]=(lv[q.level]||0)+1});
  return {sk,lv};
}

/* ---------- building a set ---------- */
function rank(pool,n){
  const now=Date.now();
  return pool.map(x=>{const s=H.seen[x.id]||{n:0,t:0};return {x,k:s.n+(now-s.t<72*36e5?.5:0)+Math.random()*.4}}).sort((a,b)=>a.k-b.k).slice(0,n).map(o=>o.x);
}
function pickBase(subj,n){
  if(subj==='quant'){
    const pool=GENS.map((_,i)=>({id:GENS[i].name,i}));
    const ids=['gPrice','gMargin','gWeighted','gCompound','gBreak','gMedian','gRatio','gDiscount','gChartGrowth','gChartMean','gFx'];
    const map={gPrice:'g-price',gMargin:'g-margin',gWeighted:'g-weighted',gCompound:'g-compound',gBreak:'g-break',gMedian:'g-median',gRatio:'g-ratio',gDiscount:'g-discount',gChartGrowth:'g-chartgrowth',gChartMean:'g-chartmean',gFx:'g-fx'};
    const p=pool.map(o=>({id:map[o.id],i:o.i}));
    return rank(p,n).map(o=>makeVariant(o.i)).filter(Boolean);
  }
  const pool=BANK.filter(q=>q.subj===subj);
  const chosen=rank(pool,n).map(reshuffle);
  const groups=[];
  chosen.forEach(q=>{let g=groups.find(x=>x.k===q.grp);if(!g){g={k:q.grp,items:[]};groups.push(g)}g.items.push(q)});
  return shuffle(groups).flatMap(g=>g.items);
}

async function genAI(subj,n){
  if(!SAMPLE||n<=0)return {items:[],dropped:0,failed:false};
  try{
    const resp=await fetch('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subj,n,avoid:H.aiStems.slice(-8)})});
    if(!resp.ok)throw new Error('http '+resp.status);
    const raw=await resp.json();
    const arr=Array.isArray(raw)?raw:(Array.isArray(raw?.items)?raw.items:[]);
    const out=[];let dropped=0;
    arr.slice(0,n+2).forEach((x,i)=>{
      const q={id:'ai-'+Date.now().toString(36)+i,subj,grp:'',skill:String(x.skill||'โจทย์ใหม่').slice(0,30),level:Math.min(3,Math.max(1,parseInt(x.level)||2)),src:'ai',
        ctx:String(x.ctx||''),stem:x.stem,chart:'',choices:Array.isArray(x.choices)?x.choices.map(String):[],ans:Number(x.ans),why:Array.isArray(x.why)?x.why.map(String):[]};
      q.grp=q.ctx?'ai:'+q.ctx.slice(0,40):q.id;
      if(editorCheck(q).length)dropped++;else if(out.length<n)out.push(reshuffle(q));
    });
    out.forEach(q=>{H.aiStems.push(String(q.stem).slice(0,60))});H.aiStems=H.aiStems.slice(-24);
    const g=[];out.forEach(q=>{let a=g.find(x=>x.k===q.grp);if(!a){a={k:q.grp,items:[]};g.push(a)}a.items.push(q)});
    return {items:g.flatMap(a=>a.items),dropped,failed:false};
  }catch(e){return {items:[],dropped:0,failed:true}}
}
async function buildSet(subj,useAI){
  const want=useAI&&SAMPLE?3:0;
  const ai=await genAI(subj,want);
  const base=pickBase(subj,10-ai.items.length);
  return {qs:[...base,...ai.items],ai:ai.items.length,dropped:ai.dropped,failed:ai.failed,asked:want};
}

async function startRun(){
  const c=S.cfg,subjects=c.subj==='all'?ORDER:[c.subj];
  S.view='prep';S.quit=false;S.confirm=false;S.hist=0;S.tool='';S.calc=newCalc();toolsSig='';
  S.prep=TEAMS.map((t,i)=>({...t,state:i===0?'run':'wait',note:i===0?(c.ai&&SAMPLE?'กำลังเลือกข้อสอบจากคลัง และให้ทีมคิดโจทย์ใหม่':'กำลังเลือกข้อสอบจากคลัง'):''}));
  render();
  const sets=await Promise.all(subjects.map(s=>buildSet(s,c.ai)));
  const all=sets.flatMap(s=>s.qs),bp=blueprint(all);
  const ai=sets.reduce((a,s)=>a+s.ai,0),dropped=sets.reduce((a,s)=>a+s.dropped,0),failed=sets.some(s=>s.failed);
  const notes=[
    `เลือกโจทย์ ${all.length} ข้อ: ปรับตัวเลขใหม่/จากคลัง ${all.length-ai} ข้อ, คิดใหม่ ${ai} ข้อ${failed?' (คิดข้อใหม่ไม่สำเร็จ ใช้ข้อจากคลังแทน)':''}`,
    `ตรวจแล้วว่าทุกข้อมีเฉลยและคำอธิบายครบทั้ง 4 ตัวเลือก`,
    `ผังข้อสอบ: ${Object.keys(bp.sk).length} ทักษะ, ง่าย ${bp.lv[1]} ปานกลาง ${bp.lv[2]} ยาก ${bp.lv[3]}`,
    `ผ่านการตรวจโครงสร้างโจทย์ ${all.length} ข้อ${dropped?`, ตัดออก ${dropped} ข้อที่มีข้อบกพร่อง`:''}`];
  for(let i=0;i<4;i++){
    S.prep[i].state='done';S.prep[i].note=notes[i];if(i<3)S.prep[i+1].state='run';
    render();await new Promise(r=>setTimeout(r,i===3?450:380));
  }
  S.run={mode:c.subj==='all'?'all':'single',sid:Date.now(),cur:0,
    stages:subjects.map((s,i)=>({subj:s,qs:sets[i].qs,ans:sets[i].qs.map(()=>-1),flag:sets[i].qs.map(()=>false),qi:0,done:false,start:0,deadline:0,used:0,auto:false}))};
  beginStage(0);
}
function beginStage(i){
  const R=S.run,st=R.stages[i],c=S.cfg;R.cur=i;st.start=Date.now();
  const mins=R.mode==='all'?40:(c.timed?c.mins:0);
  st.deadline=mins?st.start+mins*60000:0;
  S.view='quiz';S.confirm=false;S.quit=false;render();window.scrollTo(0,0);
}
function finishStage(auto){
  const R=S.run,st=R.stages[R.cur];if(st.done)return;
  st.done=true;st.auto=!!auto;st.used=Math.round((Math.min(Date.now(),st.deadline||Date.now())-st.start)/1000);
  const now=Date.now();
  st.qs.forEach((q,i)=>{const s=H.seen[q.id]||{n:0,t:0};H.seen[q.id]={n:s.n+1,t:now};
    const a=H.stats[q.id]||{n:0,c:0};H.stats[q.id]={n:a.n+1,c:a.c+(st.ans[i]===q.ans?1:0)}});
  H.attempts.push({s:st.subj,d:now,sc:st.qs.filter((q,i)=>st.ans[i]===q.ans).length,tot:st.qs.length,sec:st.used,m:R.mode,sid:R.sid,det:{qs:st.qs.map(slim),ans:st.ans.slice(),auto:st.auto}});
  H.attempts=H.attempts.slice(-60);saveH();
  S.confirm=false;S.rtab=0;S.rfilter='all';
  if(R.cur<R.stages.length-1)S.view='between';else S.view='result';
  render();window.scrollTo(0,0);
}
const score=st=>st.qs.filter((q,i)=>st.ans[i]===q.ans).length;

/* ---------- history ---------- */
const HN={quant:'การวิเคราะห์เชิงปริมาณ',qual:'การวิเคราะห์เชิงคุณภาพ',eng:'การสื่อสารภาษาอังกฤษ'};
const slim=q=>({id:q.id,subj:q.subj,skill:q.skill,level:q.level,src:q.src,ctx:q.ctx,stem:q.stem,chart:q.chart,choices:q.choices,ans:q.ans,why:q.why});
function histRows(){
  const out=[],seen=new Set();
  for(let i=H.attempts.length-1;i>=0&&out.length<8;i--){
    const a=H.attempts[i];
    if(a.m==='all'&&a.sid){
      if(seen.has(a.sid))continue;seen.add(a.sid);
      const g=H.attempts.filter(x=>x.sid===a.sid&&x.m==='all');
      out.push({v:'s:'+a.sid,d:a.d,t:'รวม '+g.length+' วิชา',sc:g.reduce((s,x)=>s+x.sc,0),tot:g.reduce((s,x)=>s+x.tot,0),sec:g.reduce((s,x)=>s+x.sec,0),ok:g.every(x=>x.det)});
    }else out.push({v:'i:'+i,d:a.d,t:HN[a.s],sc:a.sc,tot:a.tot,sec:a.sec,ok:!!a.det});
  }
  return out;
}
function openHist(v){
  let es;
  if(v[0]==='s'){const sid=+v.slice(2);es=H.attempts.filter(a=>a.sid===sid&&a.m==='all'&&a.det)}
  else es=[H.attempts[+v.slice(2)]].filter(a=>a&&a.det);
  if(!es.length)return;
  es.sort((a,b)=>ORDER.indexOf(a.s)-ORDER.indexOf(b.s));
  S.run={mode:es[0].m==='all'?'all':'single',sid:es[0].sid||0,cur:0,
    stages:es.map(a=>({subj:a.s,qs:a.det.qs,ans:a.det.ans,flag:a.det.ans.map(()=>false),qi:0,done:true,start:0,deadline:0,used:a.sec,auto:!!a.det.auto}))};
  S.hist=es[0].d;S.view='result';S.rtab=0;S.rfilter='all';render();window.scrollTo(0,0);
}

/* ---------- tools: calculator + scratchpad (quantitative only) ---------- */
const CALC_OPS=['+','−','×','÷','^'];
const CALC_KEYS=[['C','ล้าง','fn'],['⌫','ลบ','fn'],['(','(','op'],[')',')','op'],
 ['√','√','op'],['²','x²','op'],['^','xʸ','op'],['÷','÷','op'],
 ['7'],['8'],['9'],['×','×','op'],['4'],['5'],['6'],['−','−','op'],['1'],['2'],['3'],['+','+','op'],
 ['0'],['.'],['%','%','op'],['=','=','eq']];
const CALC_LBL={'C':'ล้างทั้งหมด','⌫':'ลบตัวสุดท้าย','√':'รากที่สอง','²':'ยกกำลังสอง','^':'ยกกำลัง','−':'ลบ','×':'คูณ','÷':'หาร','+':'บวก','=':'เท่ากับ','%':'เปอร์เซ็นต์','.':'จุดทศนิยม','(':'เปิดวงเล็บ',')':'ปิดวงเล็บ'};
const newCalc=()=>({expr:'',eq:false,shown:'',num:0,val:'',err:false});
S.tool='';S.calc=newCalc();S.toolPos=null;
let toolsSig='';
const TOOLS_ON=()=>S.view==='quiz'&&!!S.run&&S.run.stages[S.run.cur].subj==='quant';

function calcEval(src){
  try{
    let s=String(src).replace(/\s+/g,'').replace(/[+\-−×÷*\/^]+$/,'');
    if(!s)return{ok:true,empty:true,v:0};
    let d=0;for(const ch of s){if(ch==='(')d++;else if(ch===')'){d--;if(d<0)return{ok:false}}}
    s+=')'.repeat(d);
    const t=[],re=/(\d+\.?\d*(?:e[+-]?\d+)?|\.\d+(?:e[+-]?\d+)?)|([+\-−×÷*\/^()%²√])/iy;
    let i=0;
    while(i<s.length){re.lastIndex=i;const m=re.exec(s);if(!m)return{ok:false};
      if(m[1]!==undefined)t.push({n:parseFloat(m[1])});
      else{const o=m[2];t.push({o:o==='-'?'−':o==='*'?'×':o==='/'?'÷':o})}
      i=re.lastIndex}
    let p=0;
    const isO=c=>t[p]&&t[p].o===c;
    const expr=()=>{let a=term();
      while(isO('+')||isO('−')){const sub=t[p++].o==='−',b=term(),bv=b.pct?a.v*b.v:b.v;a={v:sub?a.v-bv:a.v+bv,pct:false}}
      return a};
    const term=()=>{let a=unary();
      for(;;){const x=t[p];if(!x)break;
        if(x.o==='×'||x.o==='÷'){p++;const b=unary();if(x.o==='÷'&&b.v===0)throw 0;a={v:x.o==='×'?a.v*b.v:a.v/b.v,pct:false}}
        else if(x.n!==undefined||x.o==='('||x.o==='√'){const b=unary();a={v:a.v*b.v,pct:false}}
        else break}
      return a};
    const unary=()=>{if(isO('−')){p++;const a=unary();return{v:-a.v,pct:false}}if(isO('+')){p++;return unary()}return power()};
    const power=()=>{const a=postfix();if(isO('^')){p++;const b=unary();return{v:Math.pow(a.v,b.v),pct:false}}return a};
    const postfix=()=>{let a=primary();
      while(isO('%')||isO('²')){const o=t[p++].o;a=o==='%'?{v:a.v/100,pct:true}:{v:a.v*a.v,pct:false}}
      return a};
    const primary=()=>{const x=t[p];if(!x)throw 0;
      if(x.n!==undefined){p++;return{v:x.n,pct:false}}
      if(x.o==='('){p++;const a=expr();if(!isO(')'))throw 0;p++;return{v:a.v,pct:false}}
      if(x.o==='√'){p++;const a=primary();if(a.v<0)throw 0;return{v:Math.sqrt(a.v),pct:false}}
      throw 0};
    const r=expr();
    if(p<t.length||!Number.isFinite(r.v))return{ok:false};
    return{ok:true,v:r.v};
  }catch(e){return{ok:false}}
}
function fmtNum(v){
  const r=Number(v.toPrecision(12));if(r===0)return'0';
  const a=Math.abs(r);if(a>=1e15||a<1e-9)return String(r).replace('e+','e');
  return r.toLocaleString('en-US',{maximumFractionDigits:10});
}
function rawNum(v){const s=String(Number(v.toPrecision(12)));return s[0]==='-'?'−'+s.slice(1):s}

function calcKey(k){
  const C=S.calc;C.err=false;
  const isDig=/^[0-9]$/.test(k),isOp=CALC_OPS.includes(k);
  if(k==='C'){Object.assign(C,newCalc())}
  else if(k==='⌫'){
    if(C.eq)Object.assign(C,newCalc());
    else C.expr=C.expr.endsWith('√(')?C.expr.slice(0,-2):C.expr.slice(0,-1);
  }else if(k==='='){
    if(!C.eq&&C.expr!==''){const r=calcEval(C.expr);
      if(r.empty){}else if(!r.ok){C.err=true}else{C.shown=C.expr;C.num=r.v;C.val=rawNum(r.v);C.eq=true}}
  }else{
    if(C.eq){C.expr=(isOp||k==='%'||k==='²')?C.val:'';C.eq=false}
    const e=C.expr,last=e.slice(-1);
    const open=(e.match(/\(/g)||[]).length-(e.match(/\)/g)||[]).length;
    if(isDig){C.expr=e+k}
    else if(k==='.'){const chunk=e.match(/[0-9.]*$/)[0];if(!chunk.includes('.'))C.expr=e+(chunk===''?'0.':'.')}
    else if(isOp){
      if(e===''){if(k==='−')C.expr='−'}
      else if(k==='−'&&'×÷^('.includes(last)){C.expr=e+k}
      else{let s=e;while(s&&CALC_OPS.includes(s.slice(-1)))s=s.slice(0,-1);
        if(s===''||s.slice(-1)==='(')C.expr=k==='−'?s+'−':s;else C.expr=s+k}
    }
    else if(k==='('){C.expr=e+'('}
    else if(k===')'){if(open>0&&last!==''&&last!=='('&&!CALC_OPS.includes(last))C.expr=e+')'}
    else if(k==='%'||k==='²'){if(/[0-9)%²]$/.test(e))C.expr=e+k}
    else if(k==='√'){C.expr=e+'√('}
  }
  paintCalc();
}
function paintCalc(){
  const a=$('#cexp'),b=$('#cres');if(!a||!b)return;
  const C=S.calc;
  if(C.eq){a.textContent=C.shown+' =';b.textContent=fmtNum(C.num)}
  else{
    b.textContent=C.expr||'0';
    if(C.err)a.textContent='คำนวณไม่ได้ ตรวจสอบนิพจน์อีกครั้ง';
    else{const r=calcEval(C.expr);a.textContent=(C.expr&&r.ok&&!r.empty&&!/^−?[0-9.]*$/.test(C.expr))?'= '+fmtNum(r.v):''}
  }
  b.scrollLeft=b.scrollWidth;
}
function calcHtml(){
  return `<section class="tp" id="calcp" role="dialog" aria-label="เครื่องคิดเลข" tabindex="-1">
   <div class="th"><b title="ลากเพื่อย้ายตำแหน่ง">เครื่องคิดเลข</b><button class="tx" data-t="close" aria-label="ปิดเครื่องคิดเลข">${ic('x')}</button></div>

   <p class="note">พิมพ์ตัวเลขและเครื่องหมายจากคีย์บอร์ดได้ เช่น 200 + 10% = 220 และ 1000 × (1 + 5%)^2</p></section>`;

${esc(txt)}</textarea>

function renderTools(){
  const el=$('#tools');if(!el)return;
  const on=TOOLS_ON();
  if(document.body){document.body.classList.toggle('hastools',on);document.body.classList.toggle('toolopen',on&&!!S.tool)}

}
function applyPos(){
  const pn=document.querySelector('#tools .tp');if(!pn||!S.toolPos)return;
  const w=pn.offsetWidth,hh=pn.offsetHeight;
  const x=Math.min(Math.max(0,S.toolPos.x),Math.max(0,innerWidth-w)),y=Math.min(Math.max(0,S.toolPos.y),Math.max(0,innerHeight-hh));
  S.toolPos={x,y};

}
let drag=null;
document.addEventListener('pointerdown',e=>{

  if(!hd||e.target.closest('button'))return;
  const pn=hd.closest('.tp'),r=pn.getBoundingClientRect();

function setTool(t,focus){
  const prev=S.tool;S.tool=t;toolsSig='';renderTools();
  const f=t==='calc'?$('#calcp'):t==='pad'?$('#padt'):document.querySelector('#tools [data-t="'+(focus||prev)+'"]');
  if(f&&f.focus)f.focus({preventScroll:true});
}
document.addEventListener('click',e=>{
  const kb=e.target.closest('#tools [data-k]');

  const tb=e.target.closest('#tools [data-t]');if(!tb)return;

  if(t==='calc'||t==='pad')setTool(S.tool===t?'':t,t);
  else if(t==='close')setTool('',S.tool);
  else if(t==='clearpad'&&TOOLS_ON()){const st=S.run.stages[S.run.cur];if(st.notes)st.notes[st.qi]='';const ta=$('#padt');if(ta){ta.value='';ta.focus()}}

document.addEventListener('input',e=>{

document.addEventListener('keydown',e=>{
  if(!e.target.closest||e.ctrlKey||e.metaKey||e.altKey)return;
  if(e.key==='Escape'&&e.target.closest('#tools')&&S.tool){e.preventDefault();setTool('',S.tool);return}
  if(!e.target.closest('#calcp')||e.target.closest('.th'))return;
  const key=e.key;let k=null;
  if(/^[0-9]$/.test(key))k=key;
  else if(key==='.'||key===',')k='.';
  else if(key==='+')k='+';
  else if(key==='-')k='−';
  else if(key==='*'||key==='x'||key==='X')k='×';
  else if(key==='/')k='÷';
  else if(key==='^')k='^';
  else if(key==='('||key===')'||key==='%')k=key;
  else if(key==='Enter'||key==='=')k='=';
  else if(key==='Backspace')k='⌫';
  else if(key==='Delete'||key==='c'||key==='C')k='C';
  if(k===null)return;
  if(key==='Enter'&&e.target.matches('[data-k]'))return;
  e.preventDefault();calcKey(k);
});

document.addEventListener('click',e=>{

    case'subj':S.cfg.subj=v;render();break;
    case'timed':S.cfg.timed=v==='1';render();break;
    case'start':startRun();break;
    case'pick':st.ans[st.qi]=+v;render();break;
    case'prev':st.qi=Math.max(0,st.qi-1);S.confirm=false;render();window.scrollTo(0,0);break;
    case'next':st.qi=Math.min(st.qs.length-1,st.qi+1);render();window.scrollTo(0,0);break;
    case'go':st.qi=+v;render();window.scrollTo(0,0);break;
    case'flag':st.flag[st.qi]=!st.flag[st.qi];render();break;
    case'ask':S.confirm=true;S.quit=false;render();break;
    case'quit':S.quit=true;S.confirm=false;render();break;
    case'cancel':S.confirm=false;S.quit=false;render();break;
    case'submit':finishStage(false);break;
    case'nextstage':beginStage(R.cur+1);break;
    case'leave':S.view='home';S.run=null;S.hist=0;S.confirm=false;S.quit=false;render();window.scrollTo(0,0);break;
    case'again':startRun();break;
    case'hist':openHist(v);break;
    case'rtab':S.rtab=+v;render();break;
    case'rfilter':S.rfilter=v;render();break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.id==='mins'){S.cfg.mins=+t.value}
  if(t.id==='ai'){S.cfg.ai=t.checked}
});
document.addEventListener('keydown',e=>{
  if(S.view!=='quiz'||e.target.closest('select,input,textarea,#tools'))return;
  const st=S.run.stages[S.run.cur];
  if(e.key>='1'&&e.key<='4'){st.ans[st.qi]=+e.key-1;render()}
  else if(e.key==='ArrowRight'&&st.qi<st.qs.length-1){st.qi++;render();window.scrollTo(0,0)}
  else if(e.key==='ArrowLeft'&&st.qi>0){st.qi--;render();window.scrollTo(0,0)}
});
render();
</script>

</body>
</html>
